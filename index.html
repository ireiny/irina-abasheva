<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Irina Abasheva — real estate, relocation and property services in Portugal.">
  <title>Irina Abasheva | Real Estate & Relocation in Portugal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="#top">IRINA <span>ABASHEVA</span></a>
      <button class="menu-toggle" aria-label="Open menu">☰</button>
      <nav id="nav">
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <button class="lang" data-lang="ru">RU</button>
        <button class="lang active" data-lang="en">EN</button>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <p class="eyebrow" data-en="PORTUGAL · REAL ESTATE · RELOCATION" data-ru="ПОРТУГАЛИЯ · НЕДВИЖИМОСТЬ · РЕЛОКАЦИЯ"></p>
          <h1 data-en="Your life in Portugal, with the right support." data-ru="Ваша жизнь в Португалии — с правильной поддержкой."></h1>
          <p class="hero-text" data-en="Property, relocation and practical support — from finding a home to settling into everyday life in Portugal." data-ru="Недвижимость, релокация и практическая помощь — от поиска жилья до обустройства жизни в Португалии."></p>
          <div class="hero-actions">
            <a class="button" href="#services" data-en="Explore services" data-ru="Посмотреть услуги"></a>
            <a class="button button-light" href="#contact" data-en="Contact me" data-ru="Связаться со мной"></a>
          </div>
        </div>
        <div class="hero-card">
          <span>Portugal</span>
          <strong>Real estate<br>& relocation</strong>
          <small>Personal service · Local knowledge · Full support</small>
        </div>
      </div>
    </section>

    <section class="intro">
      <div class="container narrow">
        <p class="eyebrow" data-en="HOW I CAN HELP" data-ru="ЧЕМ Я МОГУ ПОМОЧЬ"></p>
        <h2 data-en="One point of contact for the important things." data-ru="Один человек, который помогает решить важные вопросы."></h2>
        <p data-en="Whether you are buying, selling, renting, relocating or simply need practical help after moving, I can coordinate the process and keep things clear and organised." data-ru="Покупка, продажа, аренда, переезд или практические вопросы после переезда — я помогу организовать процесс и сделать его понятным и спокойным."></p>
      </div>
    </section>

    <section id="services" class="services section">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow" data-en="SERVICES" data-ru="УСЛУГИ"></p>
          <h2 data-en="Services in Portugal" data-ru="Услуги в Португалии"></h2>
        </div>
        <div class="service-grid">

          <article class="service-card">
            <span class="number">01</span>
            <h3 data-en="Selling Your Property" data-ru="Продажа вашей недвижимости"></h3>
            <p data-en="Full support from preparing the property and finding buyers to negotiation and completion." data-ru="Полное сопровождение — от подготовки объекта и поиска покупателей до переговоров и завершения сделки."></p>
            <div class="price">5% + VAT 23%</div>
            <small data-en="Paid only upon successful completion." data-ru="Оплата только после успешного завершения сделки."></small>
          </article>

          <article class="service-card">
            <span class="number">02</span>
            <h3 data-en="Property Search for Purchase" data-ru="Поиск недвижимости для покупки"></h3>
            <p data-en="A tailored search based on your goals, budget and lifestyle, with viewings, negotiation and transaction support." data-ru="Поиск с учётом ваших целей, бюджета и образа жизни, включая просмотры, переговоры и сопровождение покупки."></p>
            <div class="price">€1,000</div>
          </article>

          <article class="service-card">
            <span class="number">03</span>
            <h3 data-en="Rental Property Search" data-ru="Поиск аренды жилья"></h3>
            <p data-en="I find suitable properties, communicate with landlords and agencies, organise viewings and support the rental process." data-ru="Подбор вариантов, общение с собственниками и агентствами, просмотры и сопровождение процесса аренды."></p>
            <div class="price">1 month / 50%</div>
            <small data-en="Long-term 12+ months / mid-term 1–11 months." data-ru="Долгосрочная аренда 12+ месяцев / среднесрочная 1–11 месяцев."></small>
          </article>

          <article class="service-card">
            <span class="number">04</span>
            <h3 data-en="Renting Out Your Property" data-ru="Сдача вашей недвижимости в аренду"></h3>
            <p data-en="I manage the tenant search, listing, enquiries, screening, viewings, negotiation, contract coordination and key handover." data-ru="Поиск арендатора, объявление, запросы, предварительный отбор, просмотры, переговоры, договор и передача ключей."></p>
            <div class="price">1–1.5 months' rent</div>
            <small data-en="Long-term rental. Property management is priced individually." data-ru="Долгосрочная аренда. Управление объектом рассчитывается индивидуально."></small>
          </article>

          <article class="service-card">
            <span class="number">05</span>
            <h3 data-en="Choosing the Right Area" data-ru="Помощь в выборе района"></h3>
            <p data-en="A private tour by car or on foot, with practical information about neighbourhoods, schools, transport, infrastructure and property prices." data-ru="Индивидуальная поездка на машине или прогулка с практической информацией о районах, школах, транспорте, инфраструктуре и ценах на недвижимость."></p>
            <div class="price">€200 / 2 hours</div>
            <small data-en="Outside Lisbon area: individual pricing." data-ru="За пределами Лиссабона — индивидуальная стоимость."></small>
          </article>

          <article class="service-card">
            <span class="number">06</span>
            <h3 data-en="Relocation Consultation" data-ru="Консультация по переезду в Португалию"></h3>
            <p data-en="An online consultation about regions, cities, living costs, housing, schools, healthcare, infrastructure and everyday life in Portugal." data-ru="Онлайн-консультация о регионах и городах, стоимости жизни, жилье, школах, медицине, инфраструктуре и реальной жизни в Португалии."></p>
            <div class="price">€100 / hour</div>
          </article>

          <article class="service-card">
            <span class="number">07</span>
            <h3 data-en="Utility Connection Services" data-ru="Подключение коммунальных услуг"></h3>
            <p data-en="Help with electricity, water, gas, internet and other essential services after buying or renting a property." data-ru="Помощь с электричеством, водой, газом, интернетом и другими необходимыми услугами после покупки или аренды жилья."></p>
            <div class="price">€120</div>
            <small data-en="In-person visit, if required: +€5 per visit within Greater Lisbon." data-ru="Выезд при необходимости: +€5 за выезд в зоне Большого Лиссабона."></small>
          </article>

          <article class="service-card">
            <span class="number">08</span>
            <h3 data-en="Cars from Germany & France" data-ru="Автомобили из Германии и Франции"></h3>
            <p data-en="Vehicle search, information checks, technical inspection, negotiation, purchase, transport to Portugal, customs, taxes, registration and documentation." data-ru="Поиск автомобиля, проверка информации, техническая инспекция, переговоры, покупка, доставка в Португалию, таможня, налоги, регистрация и документы."></p>
            <div class="price">€3,500</div>
            <small data-en="Full support." data-ru="Полное сопровождение."></small>
          </article>

        </div>
      </div>
    </section>

    <section id="about" class="about section">
      <div class="container about-grid">
        <div>
          <p class="eyebrow" data-en="ABOUT ME" data-ru="ОБО МНЕ"></p>
          <h2 data-en="Portugal is not just a destination. It is everyday life." data-ru="Португалия — это не просто место. Это жизнь каждый день."></h2>
        </div>
        <div>
          <p data-en="I am Irina Abasheva, a real estate and relocation professional in Portugal. I help clients navigate property, relocation and practical matters with a personal, hands-on approach." data-ru="Я Ирина Абашева, специалист по недвижимости и релокации в Португалии. Я помогаю решать вопросы, связанные с недвижимостью, переездом и повседневной жизнью, лично сопровождая процесс."></p>
          <p data-en="My goal is to make complicated processes more understandable, organised and comfortable — with one person who knows your situation and stays involved." data-ru="Моя задача — сделать сложные процессы понятнее, организованнее и комфортнее, когда рядом есть один человек, который знает вашу ситуацию и сопровождает вас на протяжении всего процесса."></p>
        </div>
      </div>
    </section>

    <section id="contact" class="contact section">
      <div class="container contact-box">
        <div>
          <p class="eyebrow" data-en="CONTACT" data-ru="КОНТАКТЫ"></p>
          <h2 data-en="Let’s talk about what you need in Portugal." data-ru="Давайте обсудим, что вам нужно в Португалии."></h2>
          <p data-en="Tell me what you are looking for and I will get back to you." data-ru="Расскажите, что вам нужно, и я свяжусь с вами."></p>
        </div>
        <div class="contact-actions">
          <a class="button" href="mailto:YOUR_EMAIL@example.com">Email</a>
          <a class="button button-light" href="https://wa.me/YOURNUMBER">WhatsApp</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer">
      <span>© <span id="year"></span> Irina Abasheva</span>
      <span>Portugal</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
